<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vid Up Beta v1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --green:#4cae59;
    --green-dark:#358c43;
    --green-soft:#eef8ef;
    --text:#171717;
    --muted:#777;
    --line:#e9e9e9;
    --red:#e04b4b;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:var(--text);
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
}

.logo-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.tv{
    position:relative;
    width:118px;
    height:86px;
    background:linear-gradient(
        145deg,
        #5fba68,
        #43a451
    );
    border-radius:27px 27px 24px 24px;
    box-shadow:
        inset 0 -5px 0 rgba(0,0,0,.08),
        0 7px 16px rgba(55,120,65,.14);
    transform:rotate(-1deg);
}

.tv:before{
    content:"";
    position:absolute;
    left:10px;
    top:9px;
    width:10px;
    height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
}

.screen{
    position:absolute;
    left:13px;
    top:13px;
    width:78px;
    height:60px;
    border:5px solid white;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.04);
}

.screen span{
    color:#fff;
    font-size:33px;
    font-weight:800;
    letter-spacing:-2px;
}

.knob{
    position:absolute;
    right:10px;
    top:27px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 18px 0 white;
}

.antenna{
    position:absolute;
    top:-25px;
    left:53px;
    width:6px;
    height:29px;
    border-radius:8px;
    background:#43a451;
    transform:rotate(-34deg);
}

.antenna.right{
    left:68px;
    transform:rotate(34deg);
}

.antenna:after{
    content:"";
    position:absolute;
    width:13px;
    height:13px;
    left:-3.5px;
    top:-7px;
    border-radius:50%;
    background:#43a451;
}

.foot{
    position:absolute;
    bottom:-8px;
    width:12px;
    height:16px;
    border-radius:0 0 7px 7px;
    background:#378d43;
}

.foot.left{
    left:20px;
    transform:rotate(12deg);
}

.foot.right{
    right:20px;
    transform:rotate(-12deg);
}

.up{
    font-size:78px;
    font-weight:900;
    line-height:1;
    letter-spacing:-7px;
}

.tagline{
    margin-top:14px;
    font-size:19px;
    letter-spacing:2px;
}

.version{
    margin-top:5px;
    color:#aaa;
    font-size:11px;
}

/* =========================
   AUTH
========================= */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 16px;
}

.auth-inner{
    width:100%;
    max-width:420px;
}

.auth-card{
    border:1px solid var(--line);
    border-radius:24px;
    padding:23px;
    box-shadow:0 10px 35px rgba(0,0,0,.045);
}

.auth-card h2{
    font-size:22px;
    margin-bottom:6px;
}

.auth-card p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:20px;
}

.error{
    color:var(--red);
    font-size:13px;
    margin-bottom:10px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:13px;
    padding:12px 13px;
    outline:none;
    background:#fff;
}

.field input:focus,
.field textarea:focus{
    border-color:var(--green);
}

.primary{
    width:100%;
    padding:13px;
    border-radius:13px;
    background:var(--green);
    color:#fff;
    font-weight:bold;
}

.primary:disabled{
    opacity:.5;
}

.switch{
    width:100%;
    margin-top:14px;
    background:none;
    color:var(--green-dark);
    font-weight:bold;
}

/* =========================
   HEADER
========================= */

.header-wrap{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
}

.header{
    max-width:1100px;
    height:64px;
    margin:auto;
    padding:0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mini-logo{
    display:flex;
    align-items:center;
    gap:7px;
}

.mini-tv{
    width:42px;
    height:31px;
    border-radius:10px;
    background:var(--green);
    display:grid;
    place-items:center;
    color:#fff;
    font-size:11px;
    font-weight:bold;
}

.mini-up{
    font-size:27px;
    font-weight:900;
    letter-spacing:-3px;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.circle{
    width:39px;
    height:39px;
    border-radius:50%;
    background:#f4f4f4;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    gap:5px;
    padding:7px 16px 10px;
    overflow-x:auto;
}

.nav button{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    background:transparent;
    color:#777;
    font-weight:bold;
}

.nav button.active{
    color:var(--green-dark);
    background:var(--green-soft);
}

/* =========================
   MAIN
========================= */

main{
    max-width:1100px;
    margin:auto;
    padding:25px 16px 80px;
}

.page-title{
    font-size:29px;
    margin-bottom:5px;
}

.page-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}

.section{
    margin-bottom:32px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.badge{
    background:var(--green-soft);
    color:var(--green-dark);
    border-radius:999px;
    padding:7px 11px;
    font-size:12px;
    font-weight:bold;
}

/* =========================
   VIDEO STRIP
========================= */

.video-strip{
    display:flex;
    gap:14px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:2px 1px 12px;
}

.video-strip::-webkit-scrollbar{
    height:4px;
}

.video-card{
    flex:0 0 265px;
    scroll-snap-align:start;
    border:1px solid var(--line);
    border-radius:19px;
    overflow:hidden;
    background:#fff;
}

.thumb{
    height:150px;
    background:#f0f0f0;
    position:relative;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    left:11px;
    bottom:11px;
    width:38px;
    height:38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff;
    color:var(--green-dark);
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.card-content{
    padding:13px;
}

.card-title{
    font-weight:bold;
    line-height:1.35;
    margin-bottom:6px;
}

.meta{
    color:var(--muted);
    font-size:12px;
}

.stats{
    display:flex;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    margin-top:9px;
}

.watch{
    width:100%;
    margin-top:11px;
    padding:9px;
    border-radius:11px;
    background:#f4f4f4;
    font-weight:bold;
}

/* =========================
   UPLOAD SLOT
========================= */

.upload-slot{
    flex:0 0 265px;
    min-height:247px;
    border:2px dashed #b8dcbc;
    border-radius:20px;
    background:#f8fcf8;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.plus{
    width:51px;
    height:51px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--green);
    color:#fff;
    font-size:29px;
    margin-bottom:12px;
}

.upload-slot strong{
    color:var(--green-dark);
}

.upload-slot span{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:18px;
}

.tab{
    flex:0 0 auto;
    padding:9px 15px;
    border-radius:999px;
    background:#f3f3f3;
    color:#777;
    font-weight:bold;
}

.tab.active{
    background:var(--green);
    color:#fff;
}

/* =========================
   FORM
========================= */

.form{
    max-width:700px;
    border:1px solid var(--line);
    border-radius:22px;
    padding:20px;
}

.file{
    border:2px dashed #ddd;
    border-radius:15px;
    padding:17px;
}

.preview{
    margin:12px 0;
    border-radius:16px;
    overflow:hidden;
    background:#111;
}

.preview video{
    display:block;
    width:100%;
    max-height:370px;
}

.progress{
    display:none;
    margin:15px 0;
    border:1px solid var(--line);
    border-radius:15px;
    padding:12px;
    background:#fafafa;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:13px;
    font-weight:bold;
}

.track{
    height:9px;
    border-radius:20px;
    overflow:hidden;
    background:#e7e7e7;
}

.bar{
    width:1%;
    height:100%;
    background:var(--green);
    transition:width .15s;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:45px 20px;
    text-align:center;
    border:1px dashed #ddd;
    border-radius:21px;
    color:#777;
}

/* =========================
   PROFILE
========================= */

.profile{
    display:flex;
    align-items:center;
    gap:15px;
    padding:18px;
    border:1px solid var(--line);
    border-radius:21px;
    margin-bottom:18px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:var(--green-soft);
    color:var(--green-dark);
    display:grid;
    place-items:center;
    font-size:27px;
    font-weight:bold;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   SETTINGS
========================= */

.settings{
    max-width:700px;
    display:grid;
    gap:9px;
}

.setting{
    padding:16px;
    border:1px solid var(--line);
    border-radius:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.setting small{
    display:block;
    margin-top:4px;
    color:#888;
}

.logout{
    padding:9px 14px;
    border-radius:999px;
    color:#d84444;
    background:#fff0f0;
    font-weight:bold;
}

/* =========================
   WATCH PAGE
========================= */

.watch-page{
    max-width:850px;
    margin:auto;
}

.watch-video{
    width:100%;
    max-height:70vh;
    display:block;
    background:#000;
    border-radius:19px;
}

.watch-title{
    font-size:24px;
    margin:15px 0 7px;
}

.watch-meta{
    color:#777;
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    margin:15px 0;
}

.actions button{
    padding:10px 15px;
    border-radius:999px;
    background:#f3f3f3;
    font-weight:bold;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    padding:11px 16px;
    border-radius:999px;
    background:#111;
    color:#fff;
    z-index:100;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .tv{
        width:100px;
        height:73px;
    }

    .screen{
        width:66px;
        height:51px;
        left:11px;
        top:11px;
    }

    .screen span{
        font-size:29px;
    }

    .up{
        font-size:64px;
    }

    .tagline{
        font-size:17px;
    }

    .video-card,
    .upload-slot{
        flex-basis:235px;
    }

    .thumb{
        height:137px;
    }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL = 
  "https://wobquhwfcnrnxquejrou.supabase.co";

const SUPABASE_ANON_KEY = 
  "sb_publishable_B1JOIZHRR-NPng_5jQ3rTw_KlUwKF2j";

const VIDEO_BUCKET="videos";
const THUMB_BUCKET="thumbnails";
const AVATAR_BUCKET="avatars";

const configured = 
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_ANON_KEY.includes("PASTE_");

const supabaseClient = 
  configured
  ? window.supabase.createClient(
      SUPABASE_URL, 
      SUPABASE_ANON_KEY
    )
  : null;




/* ==================================================
   STATE
================================================== */

let user=null;
let profile=null;
let videos=[];
let authMode="login";
let activeTab=1;
let uploading=false;


/* ==================================================
   HELPERS
================================================== */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){
    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(text){

    $("toast").textContent=text;

    $("toast").classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        $("toast").classList.add("hidden");
    },2200);
}


/* ==================================================
   AUTH SWITCH
================================================== */

$("switchButton").onclick=()=>{

    authMode=
    authMode==="login"
    ?"register"
    :"login";


    const register=
    authMode==="register";


    $("registerFields")
    .classList
    .toggle("hidden",!register);


    $("authTitle").textContent=
    register
    ?"Create your Vid Up account"
    :"Welcome to Vid Up";


    $("authDesc").textContent=
    register
    ?"Make your account and start sharing."
    :"Share your life through video.";


    $("authButton").textContent=
    register
    ?"Create Account"
    :"Login";


    $("switchButton").textContent=
    register
    ?"Already have an account? Login"
    :"Create an account";


    $("authError").textContent="";
};


/* ==================================================
   AUTH
================================================== */

$("authButton").onclick=async()=>{

    if(!configured){

        $("authError").textContent=
        "Isi SUPABASE_URL dan SUPABASE_ANON_KEY dulu.";

        return;
    }


    const email=$("email").value.trim();
    const password=$("password").value;


    if(!email||!password){

        $("authError").textContent=
        "Email dan password wajib diisi.";

        return;
    }


    const button=$("authButton");

    button.disabled=true;


    try{

        if(authMode==="register"){

            const name=$("name").value.trim();
            const username=
            $("username")
            .value
            .trim()
            .replace(/^@/,"");


            if(!name||!username){

                throw new Error(
                    "Name dan username wajib diisi."
                );
            }


            const result=
            await supabaseClient.auth.signUp({

                email,
                password,

                options:{
                    data:{
                        name,
                        username
                    }
                }

            });


            if(result.error)
                throw result.error;


            if(result.data.session){

                await startApp(
                    result.data.session.user
                );

            }else{

                $("authError").textContent=
                "Akun dibuat. Cek email jika confirmation aktif.";

            }


        }else{

            const result=
            await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });


            if(result.error)
                throw result.error;


            await startApp(
                result.data.user
            );

        }

    }catch(error){

        $("authError").textContent=
        error.message||"Terjadi kesalahan.";

    }finally{

        button.disabled=false;

        button.textContent=
        authMode==="register"
        ?"Create Account"
        :"Login";
    }

};


/* ==================================================
   START
================================================== */

async function startApp(currentUser){

    user=currentUser;

    await loadProfile();
    await loadVideos();


    $("authScreen")
    .classList
    .add("hidden");


    $("app")
    .classList
    .remove("hidden");


    openPage("home");
}


/* ==================================================
   PROFILE
================================================== */

async function loadProfile(){

    const result=
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();


    if(result.error)
        throw result.error;


    if(result.data){

        profile=result.data;
        return;
    }


    const meta=
    user.user_metadata||{};


    const newProfile={

        id:user.id,

        name:
        meta.name||
        "Vid Up User",

        username:
        meta.username||
        "user"+user.id.slice(0,6),

        bio:"",

        avatar_url:""

    };


    const inserted=
    await supabaseClient
    .from("profiles")
    .insert(newProfile)
    .select()
    .single();


    if(inserted.error)
        throw inserted.error;


    profile=inserted.data;
}


/* ==================================================
   VIDEOS
================================================== */

async function loadVideos(){

    const result=
    await supabaseClient
    .from("videos")
    .select("*")
    .eq("public",true)
    .order("created_at",{
        ascending:false
    });


    if(result.error){

        console.error(result.error);

        videos=[];

        return;
    }


    videos=result.data||[];
}


/* ==================================================
   TABS 30
================================================== */

function getTabs(){

    const result=[];


    for(
        let i=0;
        i<videos.length;
        i+=30
    ){

        result.push(
            videos.slice(i,i+30)
        );

    }


    if(!result.length)
        result.push([]);


    return result;
}


/* ==================================================
   VIDEO CARD
================================================== */

function card(video){

    const image=
    video.thumbnail_url
    ?
    `<img src="${escapeHTML(video.thumbnail_url)}">`
    :
    `<div style="
        height:100%;
        display:grid;
        place-items:center;
        color:#999;
        font-weight:bold;
    ">VID UP</div>`;


    return `

    <article class="video-card">

        <div class="thumb">

            ${image}

            <div class="play">
                ▶

/* ==================================================
   STORAGE
================================================== */

async function storageUpload(
    bucket,
    path,
    file,
    progressCallback
){

    const session=
    await supabaseClient
    .auth
    .getSession();


    const access=
    session.data.session?.access_token;


    if(!access)
        throw new Error("Session expired.");


    return new Promise((resolve,reject)=>{

        const xhr=
        new XMLHttpRequest();


        xhr.open(
            "POST",
            SUPABASE_URL+
            "/storage/v1/object/"+
            bucket+
            "/"+
            path,
            true
        );


        xhr.setRequestHeader(
            "Authorization",
            "Bearer "+access
        );


        xhr.setRequestHeader(
            "apikey",
            SUPABASE_ANON_KEY
        );


        xhr.setRequestHeader(
            "x-upsert",
            "false"
        );


        xhr.setRequestHeader(
            "content-type",
            file.type||
            "application/octet-stream"
        );


        xhr.upload.onprogress=e=>{

            if(!e.lengthComputable)
                return;


            const percent=
            Math.max(
                1,
                Math.min(
                    100,
                    Math.round(
                        e.loaded/e.total*100
                    )
                )
            );


            progressCallback?.(percent);
        };


        xhr.onload=()=>{

            if(
                xhr.status>=200 &&
                xhr.status<300
            ){

                resolve(
                    SUPABASE_URL+
                    "/storage/v1/object/public/"+
                    bucket+
                    "/"+
                    path
                );

            }else{

                reject(
                    new Error(
                        "Storage upload failed."
                    )
                );

            }

        };


        xhr.onerror=()=>{
            reject(
                new Error(
                    "Network error."
                )
            );
        };


        xhr.send(file);

    });
}


/* ==================================================
   THUMBNAIL
================================================== */

function automaticThumbnail(file){

    return new Promise((resolve,reject)=>{

        const video=
        document.createElement("video");

        const url=
        URL.createObjectURL(file);


        video.src=url;
        video.preload="metadata";
        video.muted=true;
        video.playsInline=true;


        video.onloadedmetadata=()=>{

            video.currentTime=
            Math.min(
                1,
                Math.max(
                    .1,
                    video.duration/3
                )
            );

        };


        video.onseeked=()=>{

            const canvas=
            document.createElement("canvas");


            canvas.width=640;
            canvas.height=360;


            canvas
            .getContext("2d")
            .drawImage(
                video,
                0,
                0,
                640,
                360
            );


            canvas.toBlob(blob=>{

                URL.revokeObjectURL(url);


                if(!blob){

                    reject(
                        new Error(
                            "Thumbnail failed."
                        )
                    );

                    return;
                }


                resolve(
                    new File(
                        [blob],
                        "thumbnail.jpg",
                        {
                            type:"image/jpeg"
                        }
                    )
                );

            },"image/jpeg",.85);

        };


        video.onerror=()=>{

            URL.revokeObjectURL(url);

            reject(
                new Error(
                    "Video cannot be read."
                )
            );

        };

    });
}


/* ==================================================
   PROGRESS
================================================== */

function progress(text,percent){

    const safe=
    Math.max(
        1,
        Math.min(
            100,
            Math.round(percent)
        )
    );


    $("progress").style.display="block";

    $("progressText").textContent=text;

    $("progressPercent").textContent=
    safe+"%";

    $("progressBar").style.width=
    safe+"%";
}


/* ==================================================
   UPLOAD
================================================== */

async function uploadVideo(){

    if(uploading)
        return;


    const file=
    $("videoFile").files[0];


    const thumbFile=
    $("thumbnailFile").files[0];


    const title=
    $("videoTitle")
    .value
    .trim();


    const description=
    $("videoDescription")
    .value
    .trim();


    if(!file){

        alert("Pilih video dulu.");

        return;
    }


    if(!file.type.startsWith("video/")){

        alert("File harus berupa video.");

        return;
    }


    if(!title){

        alert("Masukkan judul video.");

        return;
    }


    uploading=true;


    $("publish").disabled=true;

    $("publish").textContent=
    "Uploading...";


    try{

        const id=
        crypto?.randomUUID
        ?
        crypto.randomUUID()
        :
        "video_"+Date.now();


        const safeName=
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


        /* VIDEO */

        progress(
            "Uploading video...",
            1
        );


        const videoUrl=
        await storageUpload(
            VIDEO_BUCKET,
            user.id+
            "/"+
            id+
            "/"+
            safeName,
            file,
            p=>{
                progress(
                    "Uploading video...",
                    p
                );
            }
        );


        progress(
            "Video uploaded — 100%",
            100
        );


        /* THUMBNAIL */

        let thumb=thumbFile;


        if(!thumb){

            progress(
                "Creating thumbnail...",
                100
            );


            try{

                thumb=
                await automaticThumbnail(file);

            }catch(e){

                thumb=null;

            }

        }


        let thumbnailUrl="";


        if(thumb){

            progress(
                "Uploading thumbnail...",
                100
            );


            thumbnailUrl=
            await storageUpload(
                THUMB_BUCKET,
                user.id+
                "/"+
                id+
                ".jpg",
                thumb,
                null
            );

        }


        progress(
            "Publishing video...",
            100
        );


        const result=
        await supabaseClient
        .from("videos")
        .insert({

            id:id,

            owner_id:user.id,

            username:
            profile?.username||
            "user",

            title:title,

            description:description,

            video_url:videoUrl,

            thumbnail_url:thumbnailUrl,

            views:0,

            up:0,

            down:0,

            public:true,

            tab_no:
            Math.floor(
                videos.length/30
            )+1,

            slot_no:
            videos.length%30+1

        });


        if(result.error)
            throw result.error;


        progress(
            "✓ Upload successful!",
            100
        );


        toast(
            "Video berhasil di-upload!"
        );


        await loadVideos();


        $("videoFile").value="";
        $("thumbnailFile").value="";
        $("videoTitle").value="";
        $("videoDescription").value="";


        setTimeout(()=>{

            activeTab=
            Math.floor(
                (videos.length-1)/30
            )+1;

            openPage("all");

        },800);


    }catch(error){

        console.error(error);

        progress(
            "✕ Upload failed",
            1
        );


        alert(
            error.message||
            "Upload gagal."
        );


    }finally{

        uploading=false;

        $("publish").disabled=false;

        $("publish").textContent=
        "Publish Video";

    }

}

/* ==================================================
   VOTE
================================================== */

async function vote(videoId,type){

    const existing=
    await supabaseClient
    .from("votes")
    .select("id,type")
    .eq("video_id",videoId)
    .eq("user_id",user.id)
    .maybeSingle();


    if(existing.data){

        if(existing.data.type===type){

            toast("Lu sudah vote.");

            return;
        }


        await supabaseClient
        .from("votes")
        .update({type})
        .eq("id",existing.data.id);

    }else{

        const result=
        await supabaseClient
        .from("votes")
        .insert({

            video_id:videoId,

            user_id:user.id,

            type:type

        });


        if(result.error){

            toast(
                result.error.message
            );

            return;
        }

    }


    const all=
    await supabaseClient
    .from("votes")
    .select("type")
    .eq("video_id",videoId);


    const up=
    (all.data||[])
    .filter(x=>x.type==="up")
    .length;


    const down=
    (all.data||[])
    .filter(x=>x.type==="down")
    .length;


    await supabaseClient
    .from("videos")
    .update({
        up,
        down
    })
    .eq("id",videoId);


    const video=
    videos.find(x=>x.id===videoId);


    if(video){

        video.up=up;
        video.down=down;

    }


    if($("upCount"))
        $("upCount").textContent=up;


    if($("downCount"))
        $("downCount").textContent=down;


    toast(
        type==="up"
        ?"Up added"
        :"Down added"
    );

}

async function saveProfile(){

    try{

        const name=
        $("editName").value.trim();


        const username=
        $("editUsername")
        .value
        .trim()
        .replace(/^@/,"");


        const bio=
        $("editBio").value.trim();


        let avatar=
        profile?.avatar_url||"";


        const file=
        $("avatarFile").files[0];


        if(file){

            avatar=
            await storageUpload(
                AVATAR_BUCKET,
                user.id+"/avatar.jpg",
                file,
                null
            );

        }


        const result=
        await supabaseClient
        .from("profiles")
        .update({

            name,
            username,
            bio,
            avatar_url:avatar

        })
        .eq("id",user.id)
        .select()
        .single();


        if(result.error)
            throw result.error;


        profile=result.data;


        await supabaseClient
        .from("videos")
        .update({
            username
        })
        .eq("owner_id",user.id);


        await loadVideos();

        toast("Profile saved.");

        profilePage();


    }catch(error){

        alert(
            error.message||
            "Profile gagal disimpan."
        );

    }

}

/* ==================================================

================================================== */

function openPage(page){

    if(!user)
        return;


    document
    .querySelectorAll(".nav button")
    .forEach(button=>{

        button.classList.toggle(
            "active",
            button.dataset.page===page
        );

    });


    if(page==="home")
        home();

    else if(page==="all")
        allPage();

    else if(page==="trending")
        trending();

    else if(page==="upload")
        uploadPage();

    else if(page==="profile")
        profilePage();

    else if(page==="settings")
        settingsPage();

}
